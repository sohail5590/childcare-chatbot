version: "3.9"

services:
  # ---------------------------------------------------
  # 1️⃣ ChromaDB (shared vector store)
  # ---------------------------------------------------
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: rag_ccb_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
      - ./Data:/app/Data               # ✅ persistent vector store
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------
  # 2️⃣ Ingestion / Upload Backend
  # ---------------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: rag_ccb_backend
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app
      - ./Data:/app/Data
      - chromadb_data:/chroma/chroma               # ✅ share Chroma persistent volume
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - PYTHONUNBUFFERED=1
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------
  # 3️⃣ Document Upload / Admin Frontend
  # ---------------------------------------------------
  frontend:
    build:
      context: ./frontend
    container_name: rag_ccb_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------
  # 4️⃣ Chat Backend (FastAPI + Re-ranker)
  # ---------------------------------------------------
  chat-backend:
    build:
      context: ./chat-feature/chat-backend
    container_name: rag_chat_backend
    ports:
      - "9100:9100"
    volumes:
      - ./chat-feature/chat-backend:/app
      - ./Data:/app/Data
      - ./hf_cache:/app/.hf_cache
      - chromadb_data:/chroma/chroma               # ✅ same volume for read consistency
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - PYTHONUNBUFFERED=1
    depends_on:
      chromadb:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 9100 --reload
    restart: unless-stopped

  # ---------------------------------------------------
  # 5️⃣ Chat Frontend (Streamlit Chat UI)
  # ---------------------------------------------------
  chat-frontend:
    build:
      context: ./chat-feature/chat-frontend
    container_name: rag_chat_frontend
    ports:
      - "8601:8501"
    volumes:
      - ./chat-feature/chat-frontend:/app
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - CHAT_BACKEND_URL=http://chat-backend:9100  # ✅ ensures internal container calls
    depends_on:
      chat-backend:
        condition: service_started
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped

volumes:
  chromadb_data:
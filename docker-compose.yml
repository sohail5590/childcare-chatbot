version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: rag_ccb_postgres
    environment:
      POSTGRES_DB: childcare
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  db-api:
    build: ./frontend/db
    container_name: rag_ccb_db_api
    ports:
      - "9200:9200"
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/childcare
    depends_on:
      - postgres
    restart: unless-stopped

  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: rag_ccb_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
      - ./Data:/app/Data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: rag_ccb_backend
    ports:
      - "9000:9000"
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./Data:/app/Data
      - ./config.json:/app/config.json
      - chromadb_data:/chroma/chroma
    env_file: .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  chat-backend:
    build: ./chat-feature/chat-backend
    container_name: rag_chat_backend
    ports:
      - "9100:9100"
    volumes:
      - ./chat-feature/chat-backend:/app
      - ./Data:/app/Data
      - ./hf_cache:/app/.hf_cache
      - chromadb_data:/chroma/chroma
    env_file: .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    depends_on:
      chromadb:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 9100 --reload
    restart: unless-stopped

  chat-agents:
    build: ./chat-feature/chat-agents
    container_name: rag_chat_agents
    ports:
      - "9300:9300"
    volumes:
      - ./chat-feature/chat-agents:/app
    env_file: .env
    environment:
      CHAT_BACKEND_URL: http://chat-backend:9100
    depends_on:
      - chat-backend
    restart: unless-stopped

  chat-frontend:
    build: ./chat-feature/chat-frontend
    container_name: rag_chat_frontend
    ports:
      - "8601:8501"
    volumes:
      - ./chat-feature/chat-frontend:/app
    env_file: .env
    environment:
      CHAT_BACKEND_URL: http://chat-backend:9100
      CHAT_AGENTS_URL: http://chat-agents:9300
    depends_on:
      - chat-backend
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped

volumes:
  chromadb_data:
  postgres_data:

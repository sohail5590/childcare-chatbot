version: "3.9"

services:
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: rag_ccb_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    # ✅ Minimal, guaranteed healthcheck: waits until TCP port 8000 is open
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: rag_ccb_backend
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app
      - ./Data:/app/Data
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    depends_on:
      chromadb:
        condition: service_healthy   # waits until ChromaDB passes healthcheck
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: rag_ccb_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  chromadb_data:
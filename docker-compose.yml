version: "3.9"

services:
  # ========================================
  # 1️⃣ ChromaDB (Vector Store)
  # ========================================
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: rag_ccb_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
      - ./Data:/app/Data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ========================================
  # 2️⃣ Ingestion Backend (Uploads + Vectorization)
  # ========================================
  backend:
    build:
      context: ./backend
    container_name: rag_ccb_backend
    ports:
      - "9000:9000"
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend              # mount backend code ONLY
      - ./Data:/app/Data
      - ./config.json:/app/config.json
      - chromadb_data:/chroma/chroma
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - PYTHONUNBUFFERED=1
      - HF_HUB_DISABLE_SSL_VERIFICATION=1
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  # ========================================
  # 3️⃣ Admin Frontend (for uploading documents)
  # ========================================
  frontend:
    build:
      context: ./frontend
    container_name: rag_ccb_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
      - ./config.json:/app/config.json
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ========================================
  # 4️⃣ Chat Backend (FastAPI + Re-ranker)
  # ========================================
  chat-backend:
    build:
      context: ./chat-feature/chat-backend
    container_name: rag_chat_backend
    ports:
      - "9100:9100"
    volumes:
      - ./chat-feature/chat-backend:/app
      - ./Data:/app/Data
      - ./hf_cache:/app/.hf_cache
      - chromadb_data:/chroma/chroma
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - PYTHONUNBUFFERED=1
      - HF_HUB_DISABLE_SSL_VERIFICATION=1
    depends_on:
      chromadb:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 9100 --reload
    restart: unless-stopped

  # ========================================
  # 5️⃣ Chat Frontend (Streamlit UI)
  # ========================================
  chat-frontend:
    build:
      context: ./chat-feature/chat-frontend
    container_name: rag_chat_frontend
    ports:
      - "8601:8501"
    volumes:
      - ./chat-feature/chat-frontend:/app
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - CHAT_BACKEND_URL=http://chat-backend:9100
    depends_on:
      chat-backend:
        condition: service_started
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped

volumes:
  chromadb_data:
